<div class="app-shell">
  <header class="app-header">
    <h1>{{ text.title() }}</h1>

    <nav class="mode-switcher" role="group" [attr.aria-label]="text.modeSwitcherAriaLabel()">
      <button
        type="button"
        class="mode-switcher__button"
        [class.mode-switcher__button--active]="data.uiMode() === 'explore'"
        (click)="data.setUiMode('explore')"
      >
        {{ text.modeExplore() }}
      </button>
      <button
        type="button"
        class="mode-switcher__button"
        [class.mode-switcher__button--active]="data.uiMode() === 'scan'"
        (click)="data.setUiMode('scan')"
      >
        {{ text.modeScan() }}
      </button>
      <button
        type="button"
        class="mode-switcher__button"
        [class.mode-switcher__button--active]="data.uiMode() === 'label'"
        (click)="data.setUiMode('label')"
      >
        {{ text.modeLabel() }}
      </button>
    </nav>

    @if (data.uiMode() === 'explore') {
      <app-search-bar></app-search-bar>
    }

    <div class="app-header__actions">
      <app-language-switcher></app-language-switcher>
      <button
        type="button"
        class="reset-button"
        (click)="data.resetDemo()"
        [attr.title]="text.resetButtonTitle()"
        [attr.aria-label]="text.resetButtonTitle()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12" />
          <path d="M3 3v9h9" />
        </svg>
      </button>
    </div>
  </header>

  <p class="app-disclaimer">{{ text.disclaimer() }}</p>

  <main class="app-body">
    @switch (data.uiMode()) {
      @case ('explore') {
        <section class="pane pane--tree" [attr.aria-label]="text.locationHierarchyAriaLabel()">
          <app-location-tree></app-location-tree>
        </section>
        <section class="pane pane--view" [attr.aria-label]="text.selectedLocationAriaLabel()">
          <app-location-view></app-location-view>
        </section>
        <section class="pane pane--detail" [attr.aria-label]="text.itemDetailAriaLabel()">
          <app-item-detail></app-item-detail>
        </section>
      }
      @case ('scan') {
        <app-scan-view class="pane pane--mode"></app-scan-view>
      }
      @case ('label') {
        <app-label-view class="pane pane--mode"></app-label-view>
      }
    }
  </main>

  <app-confirm-move-modal></app-confirm-move-modal>
</div>
