<div class="app-shell">
  <p class="app-disclaimer">{{ text.disclaimer() }}</p>

  <header class="app-header">
    <h1>{{ text.title() }}</h1>

    <nav class="mode-switcher" role="group" [attr.aria-label]="text.modeSwitcherAriaLabel()">
      <button
        type="button"
        mat-button
        class="mode-switcher__button"
        [class.mode-switcher__button--active]="navigation.uiMode() === 'explore'"
        [attr.aria-pressed]="navigation.uiMode() === 'explore'"
        (click)="navigation.setUiMode('explore')"
      >
        {{ text.modeExplore() }}
      </button>
      <button
        type="button"
        mat-button
        class="mode-switcher__button"
        [class.mode-switcher__button--active]="navigation.uiMode() === 'scan'"
        [attr.aria-pressed]="navigation.uiMode() === 'scan'"
        (click)="navigation.setUiMode('scan')"
      >
        {{ text.modeScan() }}
      </button>
    </nav>

    @if (navigation.uiMode() === 'explore') {
      <app-search-bar></app-search-bar>
    }

    <div class="app-header__actions">
      <app-language-switcher></app-language-switcher>
      <button
        type="button"
        mat-icon-button
        class="reset-button"
        (click)="collection.resetDemo()"
        [attr.title]="text.resetButtonTitle()"
        [attr.aria-label]="text.resetButtonTitle()"
      >
        <mat-icon svgIcon="reset" aria-hidden="true"></mat-icon>
      </button>
    </div>
  </header>

  <main class="app-body">
    @switch (navigation.uiMode()) {
      @case ('explore') {
        <section class="pane pane--tree" [attr.aria-label]="text.locationHierarchyAriaLabel()">
          <app-location-tree></app-location-tree>
        </section>
        <section class="pane pane--view" [attr.aria-label]="text.selectedLocationAriaLabel()">
          <app-location-view></app-location-view>
        </section>
        <section class="pane pane--detail" [attr.aria-label]="text.itemDetailAriaLabel()">
          <app-item-detail></app-item-detail>
        </section>
      }
      @case ('scan') {
        <app-scan-view class="pane pane--mode"></app-scan-view>
      }
    }
  </main>

  <app-confirm-move-modal></app-confirm-move-modal>
</div>
