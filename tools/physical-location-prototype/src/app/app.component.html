<div class="app-shell">
  <header class="app-header">
    <h1>{{ text.title() }}</h1>
    <app-search-bar></app-search-bar>
    <div class="qr-bar">
      <input
        type="text"
        [(ngModel)]="qrCode"
        (keydown.enter)="scan()"
        placeholder="item:MNCN-0001 or box:loc-0001"
        [attr.aria-label]="'Simulate QR scan'"
      />
      <button type="button" (click)="scan()">Scan QR</button>
    </div>
    @if (data.qrPending(); as pending) {
      <div class="qr-bar">
        <input
          type="text"
          [(ngModel)]="qrPosition"
          (keydown.enter)="scanPosition()"
          [placeholder]="'Posición: ' + pending.targetName"
          [attr.aria-label]="'Scan position'"
        />
        <input
          type="text"
          [(ngModel)]="qrTube"
          (keydown.enter)="scanTube()"
          [placeholder]="'Tubo: ' + pending.itemCatalogue"
          [attr.aria-label]="'Scan tube'"
        />
        <button type="button" (click)="data.cancelQr()">Cancelar</button>
      </div>
    }
    <app-language-switcher></app-language-switcher>
    <button
      type="button"
      class="reset-button"
      (click)="data.resetDemo()"
      [attr.title]="text.resetButtonTitle()"
    >
      {{ text.resetButtonLabel() }}
    </button>
  </header>

  @if (data.qrHint(); as hint) {
    <div class="qr-hint" [attr.data-type]="hint.type">{{ hint.message }}</div>
  }

  <p class="app-disclaimer">{{ text.disclaimer() }}</p>

  <main class="app-body">
    <section class="pane pane--tree" [attr.aria-label]="text.locationHierarchyAriaLabel()">
      <app-location-tree></app-location-tree>
    </section>
    <section class="pane pane--view" [attr.aria-label]="text.selectedLocationAriaLabel()">
      <app-location-view></app-location-view>
    </section>
    <section class="pane pane--detail" [attr.aria-label]="text.itemDetailAriaLabel()">
      <app-item-detail></app-item-detail>
    </section>
  </main>

  <app-confirm-move-modal></app-confirm-move-modal>
</div>
