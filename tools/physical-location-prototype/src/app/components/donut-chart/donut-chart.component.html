<div class="donut" [class.donut--sm]="size() === 'sm'">
  <svg
    class="donut__svg"
    viewBox="0 0 100 100"
    role="img"
    [attr.aria-label]="ariaLabel()"
    [style.--donut-circumference]="circumference"
  >
    <circle class="donut__track" cx="50" cy="50" r="40" fill="none" stroke-width="16"></circle>
    @for (segment of renderedSegments(); track segment.key) {
      <circle
        class="donut__segment"
        cx="50"
        cy="50"
        r="40"
        fill="none"
        stroke-width="16"
        [attr.stroke]="segment.color"
        [attr.stroke-dasharray]="segment.dasharray"
        [attr.stroke-dashoffset]="segment.dashoffset"
        [style.--segment-length]="segment.length"
        [style.--segment-remainder]="segment.remainder"
      >
        <title>{{ segment.tooltip }}</title>
      </circle>
    }
  </svg>
  <div class="donut__center">
    <span class="donut__center-label">{{ centerLabel() }}</span>
    <span class="donut__center-value">{{ centerValue() }}</span>
  </div>
</div>
<ul class="donut__legend">
  @for (segment of segments(); track segment.key) {
    <li class="legend-item">
      <span class="legend-item__swatch" [style.background]="segment.color" aria-hidden="true"></span>
      <span class="legend-item__label">{{ segment.label }}</span>
      <span class="legend-item__percent">{{ segment.percent }}%</span>
    </li>
  }
</ul>
