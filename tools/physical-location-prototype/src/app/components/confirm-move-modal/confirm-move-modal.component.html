@if (move.movingItem(); as item) {
  @if (move.pendingMoveTargetId(); as targetId) {
    <div class="modal-backdrop" (click)="cancel()">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="text.ariaLabel()"
        (click)="$event.stopPropagation()"
      >
        <p>{{ text.prompt(item.catalogueNumber, move.pendingMoveTargetLabel() ?? '') }}</p>
        <div class="modal__actions">
          <button type="button" mat-button class="modal__cancel" (click)="cancel()">{{ text.cancel() }}</button>
          <button type="button" mat-button color="primary" class="modal__confirm" (click)="confirm()">{{ text.confirm() }}</button>
        </div>
      </div>
    </div>
  }
}
