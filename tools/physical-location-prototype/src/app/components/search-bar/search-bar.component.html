<div class="search-bar">
  <mat-form-field class="search-bar__field" appearance="outline" subscriptSizing="dynamic">
    <mat-icon matPrefix svgIcon="search" aria-hidden="true"></mat-icon>
    <input
      matInput
      class="search-bar__input"
      type="search"
      [placeholder]="text.placeholder()"
      [formField]="queryField"
      [attr.aria-label]="text.ariaLabel()"
    />
  </mat-form-field>
  @if (query().trim() !== '') {
    <ul class="search-bar__results" role="listbox">
      @if (results().length === 0) {
        <li class="search-bar__empty">{{ text.noMatches() }}</li>
      }
      @for (item of results(); track item.id) {
        <li>
          <button type="button" class="search-bar__result" (click)="selectResult(item.id)">
            <span class="search-bar__result-top">
              <span class="search-bar__code">{{ item.catalogueNumber }}</span>
              @if (item.label) {
                <span class="search-bar__label">{{ item.label }}</span>
              }
            </span>
            <span class="search-bar__location">
              {{ item.locationId ? breadcrumbFor(item.locationId) : text.noCurrentLocation() }}
            </span>
          </button>
        </li>
      }
    </ul>
  }
</div>
