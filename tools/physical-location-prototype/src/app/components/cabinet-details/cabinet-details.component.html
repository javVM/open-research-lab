<div class="details-view details-view--room">
  <div class="detail-card detail-card--info">
    <div class="detail-card__header">
      <h3 class="with-icon">
        <mat-icon [svgIcon]="sc.icon(primaryCondition())" [matTooltip]="tooltip()" aria-hidden="true" class="storage-icon"></mat-icon>
        {{ location().name }}
      </h3>
      <span class="detail-card__badge">CABINET</span>
    </div>
  </div>
  <div class="detail-card"><h4 class="detail-card__heading">CONTENTS</h4><ul class="detail-list detail-list--contents">@for(child of children(); track child.id){<li><button type="button" class="detail-list__item detail-list__item--contents" (click)="selectChild.emit(child.id)"><span class="detail-list__main"><span class="detail-list__name">{{child.name}}</span></span><mat-icon svgIcon="chevronRight" class="detail-list__chevron"></mat-icon></button></li>}</ul></div>
</div>
