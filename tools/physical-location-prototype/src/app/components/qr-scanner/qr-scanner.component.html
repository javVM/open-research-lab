<div class="qr-scanner" [attr.aria-label]="text.title()">
  <div class="qr-scanner__viewport" id="qr-scanner-reader"></div>

  @if (loading()) {
    <p class="qr-scanner__status">{{ text.starting() }}</p>
  }

  @if (error()) {
    <div class="qr-scanner__alert" role="alert">
      <span class="qr-scanner__alert-icon" aria-hidden="true">⚠</span>
      <span class="qr-scanner__alert-text">{{ error() }}</span>
      <span class="qr-scanner__alert-hint">Si estás en móvil por IP (http://192.168.x.x), el navegador bloquea la cámara. Usa https, localhost o el modo “Pegar frame manual”.</span>
    </div>
  }
</div>
