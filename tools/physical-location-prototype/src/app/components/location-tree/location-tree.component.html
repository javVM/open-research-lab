@if (viewport.isMobile()) {
  <mat-form-field class="location-tree__select" appearance="outline" subscriptSizing="dynamic" [attr.aria-label]="text.ariaLabel()">
    <mat-label>{{ text.selectBuilding() }}</mat-label>
    <mat-select [value]="selectedBuildingId()" (selectionChange)="selectFromSelect($event.value)" panelClass="location-tree__select-panel">
      <mat-option value="">{{ text.allLabel() }}</mat-option>
      @for (building of buildings(); track building.id) {
        <mat-option [value]="building.id">{{ building.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
} @else {
  <div class="location-tree" role="tree" [attr.aria-label]="text.ariaLabel()">
    <div
      class="tree-row tree-row--all"
      [class.tree-row--selected]="!data.selectedLocationId()"
      [style.paddingLeft.px]="8"
      role="treeitem"
      [attr.aria-selected]="!data.selectedLocationId()"
      (click)="goHome()"
    >
      <span class="tree-name">{{ text.allLabel() }}</span>
    </div>
    <app-location-tree-nodes [nodes]="roots()" [depth]="0" />
  </div>
}
